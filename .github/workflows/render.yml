name: Render story

# Two ways to make a video:
#   1. Actions tab -> Render story -> Run workflow -> paste your story -> Run.
#   2. Add a .txt script under scripts/ and push it.
on:
  push:
    paths:
      - "scripts/**.txt"
  workflow_dispatch:
    inputs:
      story:
        description: "Paste your whole story here (# title, ## scene, then narration). This is all you need."
        required: false
        type: string
        default: ""
      script:
        description: "Advanced: render an existing file instead, e.g. scripts/my-story.txt. Leave blank if you pasted above."
        required: false
        type: string
        default: ""

# gh release create needs to write to the repo
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    # Long-form videos render many scenes back to back. GitHub allows a job up
    # to 6 hours; this ceiling stops a wedged run short of that while still
    # leaving room for a feature-length render.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need the previous commit to diff against

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Catch a broken renderer before spending 10+ minutes rendering with it.
      - name: Run tests
        run: python test_bay_studio.py

      - name: Work out which scripts to render
        id: pick
        env:
          STORY: ${{ github.event.inputs.story }}
        run: |
          set -euo pipefail
          if [ -n "${STORY:-}" ]; then
            # Pasted story: save it as a script and render just that one.
            mkdir -p scripts
            title="$(printf '%s\n' "$STORY" | grep -m1 '^#[^#]' | sed 's/^#*//;s/^ *//' || true)"
            slug="$(printf '%s' "${title:-story}" | tr '[:upper:]' '[:lower:]' \
                    | tr -cs 'a-z0-9' '-' | sed 's/^-*//;s/-*$//' | cut -c1-50)"
            [ -z "$slug" ] && slug="story"
            file="scripts/${slug}.txt"
            printf '%s\n' "$STORY" > "$file"
            echo "Saved pasted story to $file"
            targets="$file"
          elif [ -n "${{ github.event.inputs.script }}" ]; then
            # Advanced: render one named file
            targets="${{ github.event.inputs.script }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual run with nothing specified: do them all
            targets="$(ls scripts/*.txt 2>/dev/null || true)"
          else
            # Push: only what actually changed in this push
            targets="$(git diff --name-only --diff-filter=ACM \
                        "${{ github.event.before }}" "${{ github.sha }}" \
                        -- 'scripts/*.txt' 2>/dev/null || true)"
            # First push on a branch has no usable "before" commit
            if [ -z "$targets" ]; then
              targets="$(ls scripts/*.txt 2>/dev/null || true)"
            fi
          fi

          if [ -z "$targets" ]; then
            echo "No scripts to render."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rendering:"; echo "$targets" | sed 's/^/  /'
            echo "found=true" >> "$GITHUB_OUTPUT"
            { echo "targets<<EOF"; echo "$targets"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Render
        if: steps.pick.outputs.found == 'true'
        run: |
          set -euo pipefail
          mkdir -p videos
          while IFS= read -r script; do
            [ -z "$script" ] && continue
            [ -f "$script" ] || { echo "::warning::missing $script"; continue; }
            name="$(basename "${script%.txt}")"
            echo "::group::$name"
            python bay_studio.py --script "$script" --out "videos/${name}.mp4"
            echo "::endgroup::"
          done <<< "${{ steps.pick.outputs.targets }}"
          ls -lh videos/

      - name: Upload videos
        if: steps.pick.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: videos/*.mp4
          retention-days: 30
          if-no-files-found: error

      # A release gives every video a permanent download link, so you don't
      # have to dig through Actions runs to find one. The newest release is
      # always shown at the top of the repo's home page.
      - name: Publish release
        if: steps.pick.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="render-${{ github.run_number }}"
          name="$(ls videos/*.mp4 | head -1 | xargs basename | sed 's/\.mp4$//')"
          gh release create "$tag" videos/*.mp4 \
            --title "🎬 ${name} (run ${{ github.run_number }})" \
            --notes "Your video is attached below — click the .mp4 to download.

          Rendered $(date -u '+%Y-%m-%d %H:%M UTC')."
